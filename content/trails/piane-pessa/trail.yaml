description: |
  Il percorso collega il Rifugio ANA Le Piane alle Baite della Pessa.
  La traccia parte nei pressi del rifugio, a circa 1.540 m di quota,
  e si sviluppa verso sud-ovest fino a circa 1.840 m.

  Nel tratto iniziale il sentiero attraversa un bosco di
  conifere, con fondo di terra, pietre e radici e segnavia bianco-rossi
  sugli alberi. Si arriva infine alla Baite di Pessa attraverso una radura prativa
  con baite, circondata dal bosco.

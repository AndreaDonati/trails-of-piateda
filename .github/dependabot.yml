version: 2
updates:
  # Project dependencies (astro, react, maplibre-gl, etc.)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflow's own actions (checkout, setup-node, deploy-pages, ...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
